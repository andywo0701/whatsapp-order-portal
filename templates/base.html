<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f6ebe8">
  <title>{% block title %}ThreeGoodies 落單上載{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="/">
      <span class="mark" aria-hidden="true">3</span>
      <span>ThreeGoodies 落單上載</span>
    </a>
    {% if user %}
    <div class="top-right">
      <div class="who">
        <span class="who-name">{{ user }}</span>
        <span class="role">{{ role_label }} <span class="role-en">{{ role_title }}</span></span>
      </div>
      <nav class="top-actions" aria-label="帳戶">
        <a class="btn ghost" href="/customers">顧客名冊</a>
        <a class="btn ghost" href="/catalog">貨品清單</a>
        <a class="btn ghost" href="/account">帳戶</a>
        <form method="post" action="/logout">
          <input type="hidden" name="csrf" value="{{ csrf }}">
          <button type="submit" class="btn ghost">登出</button>
        </form>
      </nav>
    </div>
    {% endif %}
  </header>
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
  <script>
    document.querySelectorAll("[data-select-all]").forEach(function (master) {
      var form = master.closest("form");
      if (!form) return;
      var boxes = function () { return form.querySelectorAll('input[name="ids"]'); };
      master.addEventListener("change", function () {
        boxes().forEach(function (box) { box.checked = master.checked; });
      });
      form.addEventListener("change", function (event) {
        if (!event.target.matches || !event.target.matches('input[name="ids"]')) return;
        var list = boxes();
        master.checked = list.length > 0 && Array.prototype.every.call(list, function (box) { return box.checked; });
      });
    });
  </script>
</body>
</html>
