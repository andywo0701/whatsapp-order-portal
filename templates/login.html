{% extends "base.html" %}
{% block title %}登入｜落單上載{% endblock %}
{% block content %}
<section class="card login-card">
  <p class="eyebrow">同事入口</p>
  <h1>歡迎回來</h1>
  <p class="muted">這裡只給同事上載落單資料，以及查看處理進度。登入之後可以隨時更改自己的密碼。</p>
  {% if error %}<p class="alert" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login" class="stack">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>帳號
      <input type="text" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    </label>
    <label>密碼
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button type="submit" class="btn primary">登入</button>
  </form>
</section>
{% endblock %}
